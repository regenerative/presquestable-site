<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Presque Stable</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Presque Stable — electronic music.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ps-style.css">
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<a class="releases" id="releases" href="releases.html">
  <span class="dot" aria-hidden="true"></span>
  <span class="word">releases</span>
</a>

<div class="overlay">
  <h1 class="name">presquestable</h1>
</div>

<script src="ps-engine.js"></script>
<script>
(function () {
  var link = document.getElementById('releases');
  var name = document.querySelector('.name');
  var done = false;

  /* Positioned exactly once, while still invisible, then faded in.
     The element never moves after it becomes visible. */
  function placeOnce() {
    if (done || !window.PS) return;
    done = true;
    PS.placeRandom(link, { avoid: [name], marginX: 0.09, marginY: 0.11, pad: 90 });
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { link.classList.add('ready'); });
    });
  }

  /* Wait for the webfont so the wordmark has its final size before
     we measure it — otherwise the avoid-box would be wrong. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(placeOnce).catch(placeOnce);
    setTimeout(placeOnce, 1500);   /* fallback only; no-op if already placed */
  } else {
    window.addEventListener('load', placeOnce);
    setTimeout(placeOnce, 800);
  }

  /* Reposition only on an actual window resize. */
  var t = null;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      if (window.PS) PS.placeRandom(link, { avoid: [name], marginX: 0.09, marginY: 0.11, pad: 90 });
    }, 220);
  });
})();
</script>

</body>
</html>
