<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Presque Stable</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Presque Stable — electronic music.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ps-style.css">
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<a class="releases" id="releases" href="releases.html">
  <span class="dot" aria-hidden="true"></span>
  <span class="word">releases</span>
</a>

<div class="annotation" id="annotation">
  <span>calcium carbonate — calcite.</span>
  <span>in the inner ear these crystals tell the body which way is down.</span>
  <span class="dim">when one works loose, the horizon tilts.</span>
</div>

<div class="overlay">
  <h1 class="name">presquestable</h1>
</div>

<div class="copyright">© 2026 presque stable</div>

<script src="ps-engine.js"></script>
<script>
(function () {
  var link = document.getElementById('releases');
  var name = document.querySelector('.name');
  var done = false;

  /* Positioned exactly once, while still invisible, then faded in.
     The element never moves after it becomes visible. */
  var note = document.getElementById('annotation');

  /* avoid the wordmark and the rotating structure at centre screen */
  function avoidList() {
    return [name, PS.moleculeBox()];
  }

  /* Place the annotation once, clear of the wordmark, the structure
     and the releases link. Align it toward whichever edge it sits
     nearer, so the text reads outward rather than into the centre. */
  function placeNote() {
    if (!window.PS) return;
    note.style.opacity = '0';
    note.style.textAlign = 'left';
    /* measure untilted; the cached angle is re-applied at the end */
    note.style.transform = 'none';
    PS.placeRandom(note, {
      avoid: [name, PS.moleculeBox(), link],
      marginX: 0.05, marginY: 0.10, pad: 46
    });
    var r = note.getBoundingClientRect();
    var onRight = (r.left + r.width / 2) > window.innerWidth / 2;
    if (onRight) {
      /* pin to its right edge so the block grows leftward */
      note.style.left = Math.round(r.right - note.offsetWidth) + 'px';
      note.style.textAlign = 'right';
    } else {
      note.style.textAlign = 'left';
    }
    /* tilt last — measurement above must be on an untilted box */
    PS.tilt(note, 0.5);
  }

  /* Engine reports hover strength each frame. */
  window.PS_onHover = function (v) {
    note.style.opacity = (v * 0.92).toFixed(3);
  };

  function placeOnce() {
    if (done || !window.PS) return;
    done = true;
    PS.placeRandom(link, { avoid: avoidList(), marginX: 0.09, marginY: 0.11, pad: 90 });
    PS.tilt(link, 0.6);
    PS.tilt(document.querySelector('.copyright'), 0.5);
    placeNote();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { link.classList.add('ready'); });
    });
  }

  /* Wait for the webfont so the wordmark has its final size before
     we measure it — otherwise the avoid-box would be wrong. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(placeOnce).catch(placeOnce);
    setTimeout(placeOnce, 1500);   /* fallback only; no-op if already placed */
  } else {
    window.addEventListener('load', placeOnce);
    setTimeout(placeOnce, 800);
  }

  /* Reposition only on an actual window resize. */
  var t = null;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      if (!window.PS) return;
      PS.placeRandom(link, { avoid: avoidList(), marginX: 0.09, marginY: 0.11, pad: 90 });
      placeNote();
    }, 220);
  });
})();
</script>

</body>
</html>
