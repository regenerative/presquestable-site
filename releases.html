<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Presque Stable — Releases</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Presque Stable — releases.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ps-style.css">
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="soon" id="soon">coming soon</div>

<div class="copyright">© 2026 presque stable</div>

<script src="ps-engine.js"></script>
<script>
(function () {
  var soon = document.getElementById('soon');
  var done = false;

  /* Positioned once while invisible, then faded in. Never jumps. */
  /* keep clear of the rotating structure at centre screen */
  function avoidList() {
    return [PS.moleculeBox()];
  }

  function placeOnce() {
    if (done || !window.PS) return;
    done = true;
    PS.placeRandom(soon, { avoid: avoidList(), marginX: 0.12, marginY: 0.16, pad: 70 });
    PS.tilt(soon, 0.5);
    PS.tilt(document.querySelector('.copyright'), 0.5);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { soon.classList.add('ready'); });
    });
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(placeOnce).catch(placeOnce);
    setTimeout(placeOnce, 1500);
  } else {
    window.addEventListener('load', placeOnce);
    setTimeout(placeOnce, 800);
  }

  var t = null;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      if (window.PS) PS.placeRandom(soon, { avoid: avoidList(), marginX: 0.12, marginY: 0.16, pad: 70 });
    }, 220);
  });

  /* Invisible way back — nothing is drawn for it.
     Delete this block if you want a true dead end. */
  setTimeout(function () {
    document.addEventListener('click', function () { window.location.href = 'index.html'; });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') window.location.href = 'index.html';
    });
  }, 1200);
})();
</script>

</body>
</html>
