<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Presque Stable — Releases</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Presque Stable — releases.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ps-style.css">
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="soon" id="soon">coming soon</div>

<script src="ps-engine.js"></script>
<script>
(function () {
  var soon = document.getElementById('soon');

  function place() {
    if (window.PS) PS.placeRandom(soon, { marginX: 0.12, marginY: 0.16 });
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(place).catch(place);
  } else {
    window.addEventListener('load', place);
  }
  setTimeout(place, 400);

  var t = null;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(place, 200);
  });

  /* Invisible way back — nothing is drawn for it.
     Delete this block if you want a true dead end. */
  setTimeout(function () {
    document.addEventListener('click', function () { window.location.href = 'index.html'; });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') window.location.href = 'index.html';
    });
  }, 1200);
})();
</script>

</body>
</html>
